name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      # The tests need no native add-ons (canvas, sqlite3), so their build scripts are skipped.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
